services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: .env
    networks:
      - oykus-network
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: oykus-backend:production
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    env_file: .env
    networks:
      - oykus-network
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: oykus-nginx:production
    build:
      context: .
      dockerfile: nginx/Dockerfile
      secrets:
        - dotenv
    restart: unless-stopped
    networks:
      - oykus-network
    ports:
      - "80:80"
    volumes:
      - uploads:/var/www/uploads:ro
    depends_on:
      backend:
        condition: service_healthy

secrets:
  dotenv:
    file: .env

volumes:
  postgres-data:
  uploads:

networks:
  oykus-network:
    name: oykus-network
