<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#242424" />
    <title>You're offline — Oykus</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: "Segoe UI", "Helvetica Neue", sans-serif;
        background:
          radial-gradient(ellipse at top, #2a3140 0%, transparent 55%),
          #242424;
        color: #c4c4c4;
      }

      main {
        max-width: 28rem;
        text-align: center;
      }

      img {
        width: 4.5rem;
        height: 4.5rem;
        margin-bottom: 1.5rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
        font-weight: 600;
        color: #e8e8e8;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 1.75rem;
        line-height: 1.55;
        color: #7a7a7a;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.7rem 1.25rem;
        font: inherit;
        font-weight: 600;
        color: #f0f4ff;
        background: hsl(220, 50%, 50%);
        cursor: pointer;
      }

      button:hover {
        background: hsl(220, 60%, 58%);
      }

      button:focus-visible {
        outline: 2px solid hsl(220, 60%, 70%);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.png" width="72" height="72" alt="" />
      <h1>You're offline</h1>
      <p>
        Oykus needs a connection to load your spaces and stories.
        Check your network, then try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
